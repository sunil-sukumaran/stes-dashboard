<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>STES — Command</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f0e; --bg2:#111312; --bg3:#161918;
  --rule:rgba(255,255,255,0.07); --rule2:rgba(255,255,255,0.13); --rule3:rgba(255,255,255,0.22);
  --hi:#c8f03c; --hi2:rgba(200,240,60,0.08);
  --red:#f03c3c; --red2:rgba(240,60,60,0.09);
  --amber:#f0a23c; --amber2:rgba(240,162,60,0.09);
  --blue:#3c8ff0; --blue2:rgba(60,143,240,0.09);
  --t1:#f0ede8; --t2:rgba(240,237,232,0.55); --t3:rgba(240,237,232,0.28); --t4:rgba(240,237,232,0.1);
  --head:'Bebas Neue',sans-serif; --cond:'Barlow Condensed',sans-serif;
  --body:'Barlow',sans-serif; --mono:'IBM Plex Mono',monospace;
}
html,body,#root{height:100%;overflow:hidden;background:var(--bg);}
body{font-family:var(--body);color:var(--t1);}
#root{display:flex;}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideRight{from{opacity:0;transform:translateX(-16px);}to{opacity:1;transform:translateX(0);}}
@keyframes slideLeft{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:translateX(0);}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.94);}to{opacity:1;transform:scale(1);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.25;}}
@keyframes scanH{0%,100%{top:0%;}50%{top:100%;}}
@keyframes scanV{0%{left:0%;}100%{left:100%;}}
@keyframes sweepDown{0%{top:0%;}100%{top:100%;}}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}  }
@keyframes countUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes barGrow{from{width:0%;}to{width:var(--w);}}
@keyframes ringPulse{0%,100%{opacity:0.5;transform:scale(1);}50%{opacity:0.1;transform:scale(1.3);}}
@keyframes feedSlide{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:translateX(0);}}
@keyframes shimmer{0%{left:-100%;}100%{left:200%;}}

/* ── SIDEBAR ── */
.sb{width:200px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--rule);display:flex;flex-direction:column;height:100vh;}
.sb-brand{padding:22px 20px 18px;border-bottom:1px solid var(--rule);animation:slideRight 0.4s ease both;}
.sb-sys{font-family:var(--mono);font-size:9px;letter-spacing:0.18em;color:var(--t3);text-transform:uppercase;margin-bottom:10px;}
.sb-name{font-family:var(--head);font-size:28px;letter-spacing:0.04em;color:var(--t1);line-height:0.95;}
.sb-sub{font-family:var(--cond);font-size:11px;font-weight:300;letter-spacing:0.06em;color:var(--t3);margin-top:5px;}
.sb-sec{padding:18px 20px 4px;font-family:var(--mono);font-size:9px;letter-spacing:0.14em;color:var(--t3);text-transform:uppercase;}
.sb-item{display:flex;align-items:center;padding:9px 20px;font-family:var(--cond);font-size:14px;font-weight:400;letter-spacing:0.04em;color:var(--t2);cursor:pointer;text-decoration:none;border-left:2px solid transparent;transition:color 0.15s,border-color 0.15s,background 0.15s;}
.sb-item:hover{color:var(--t1);background:var(--rule);}
.sb-item.on{color:var(--hi);border-left-color:var(--hi);background:var(--hi2);}
.sb-badge{font-family:var(--mono);font-size:9px;margin-left:auto;color:var(--t3);}
.sb-item.on .sb-badge{color:var(--hi);}
.sb-foot{margin-top:auto;padding:14px 20px;border-top:1px solid var(--rule);}
.sb-foot-lbl{font-family:var(--mono);font-size:9px;letter-spacing:0.12em;color:var(--t3);text-transform:uppercase;margin-bottom:6px;}
.sb-foot-name{font-family:var(--cond);font-size:13px;font-weight:500;color:var(--t1);}
.sb-foot-role{font-size:11px;font-weight:300;color:var(--t3);margin-top:1px;}
.sb-foot-status{display:flex;align-items:center;gap:6px;margin-top:8px;font-family:var(--mono);font-size:9px;color:var(--hi);letter-spacing:0.1em;}
.sb-dot{width:5px;height:5px;border-radius:50%;background:var(--hi);}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{height:50px;flex-shrink:0;display:flex;align-items:center;padding:0 28px;gap:20px;border-bottom:1px solid var(--rule);background:var(--bg2);animation:fadeIn 0.3s ease both;}
.tb-title{font-family:var(--cond);font-size:13px;font-weight:500;letter-spacing:0.1em;color:var(--t2);text-transform:uppercase;flex:1;}
.tb-live{font-family:var(--mono);font-size:9px;letter-spacing:0.18em;color:var(--red);text-transform:uppercase;display:flex;align-items:center;gap:7px;}
.tb-dot{width:6px;height:6px;border-radius:50%;background:var(--red);animation:pulse 1.4s ease-in-out infinite;}
.tb-zone{font-family:var(--mono);font-size:9px;letter-spacing:0.12em;color:var(--t3);text-transform:uppercase;}
.tb-clock{font-family:var(--mono);font-size:12px;color:var(--t2);letter-spacing:0.08em;border-left:1px solid var(--rule);padding-left:20px;}

/* ── SCROLL ── */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;}
.scroll::-webkit-scrollbar{width:3px;}
.scroll::-webkit-scrollbar-thumb{background:var(--rule2);}

/* ── METRICS ── */
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--rule);}
.met{padding:20px 24px;border-right:1px solid var(--rule);position:relative;overflow:hidden;}
.met:last-child{border-right:none;}
.met-shine{position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.03),transparent);animation:shimmer 2.5s ease-in-out var(--delay,0s) both;}
.met-key{font-family:var(--mono);font-size:9px;letter-spacing:0.14em;color:var(--t3);text-transform:uppercase;margin-bottom:8px;}
.met-val{font-family:var(--head);font-size:42px;line-height:0.9;animation:countUp 0.5s ease var(--delay,0s) both;}
.met-val.hi{color:var(--hi);}
.met-val.rd{color:var(--red);}
.met-val.am{color:var(--amber);}
.met-delta{font-family:var(--mono);font-size:9px;letter-spacing:0.08em;margin-top:6px;}
.met-delta.up{color:var(--red);}
.met-delta.dn{color:var(--hi);}
.met-delta.neu{color:var(--t3);}
.met-bar{position:absolute;bottom:0;left:0;height:2px;animation:barGrow 1s ease var(--delay,0s) both;}
.met-bar.hi{background:var(--hi);}
.met-bar.rd{background:var(--red);}
.met-bar.am{background:var(--amber);}
.met-bar.bl{background:var(--blue);}

/* ── PANEL HEADER ── */
.ph{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--rule);}
.ph-title{font-family:var(--cond);font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--t2);}
.ph-btn{font-family:var(--mono);font-size:9px;letter-spacing:0.1em;color:var(--t2);text-transform:uppercase;cursor:pointer;border:1px solid var(--rule2);padding:3px 8px;border-radius:2px;background:none;transition:border-color 0.15s,color 0.15s;}
.ph-btn:hover{border-color:var(--hi);color:var(--hi);}

/* ── TWO PANE ── */
.panes{display:grid;grid-template-columns:1fr 340px;height:calc(100vh - 50px - 82px);overflow:hidden;}
.pane-l{border-right:1px solid var(--rule);overflow:hidden;display:flex;flex-direction:column;}
.pane-r{overflow-y:auto;display:flex;flex-direction:column;}
.pane-r::-webkit-scrollbar{width:3px;}
.pane-r::-webkit-scrollbar-thumb{background:var(--rule2);}

/* ── CAMERA ── */
.cam-wrap{flex:1;position:relative;background:#020403;overflow:hidden;}
canvas#camC{display:block;width:100%;height:100%;}
#camSVG{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
.scanlines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.07) 2px,rgba(0,0,0,0.07) 3px);pointer-events:none;}
.cam-sweep{position:absolute;left:0;width:100%;height:1px;background:rgba(200,240,60,0.12);animation:sweepDown 5s linear infinite;pointer-events:none;}
.cam-hud-top{position:absolute;top:0;left:0;right:0;padding:10px 14px;background:linear-gradient(180deg,rgba(2,4,3,0.88) 0%,transparent 100%);display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10px;}
.cam-rec-dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.2s infinite;}
.cam-rec{font-size:9px;letter-spacing:0.14em;color:var(--red);}
.cam-hud-id{color:rgba(200,240,60,0.8);letter-spacing:0.1em;}
.cam-hud-loc{color:rgba(255,255,255,0.35);margin-left:4px;}
.cam-hud-time{margin-left:auto;color:rgba(255,255,255,0.3);}
.cam-hud-bot{position:absolute;bottom:0;left:0;right:0;padding:10px 14px;background:linear-gradient(0deg,rgba(2,4,3,0.9) 0%,transparent 100%);display:flex;align-items:center;gap:16px;}
.cstat{display:flex;flex-direction:column;}
.cstat-v{font-family:var(--head);font-size:18px;color:var(--t1);}
.cstat-l{font-family:var(--mono);font-size:8px;letter-spacing:0.12em;color:rgba(255,255,255,0.3);text-transform:uppercase;}
.cdiv{width:1px;height:24px;background:rgba(255,255,255,0.1);}
.cam-sel{display:flex;gap:4px;padding:8px 14px;background:var(--bg2);border-top:1px solid var(--rule);flex-wrap:wrap;}
.csb{font-family:var(--mono);font-size:9px;letter-spacing:0.08em;padding:3px 9px;border:1px solid var(--rule2);background:none;color:var(--t3);cursor:pointer;border-radius:2px;transition:all 0.12s;text-transform:uppercase;}
.csb:hover{color:var(--t2);border-color:var(--rule3);}
.csb.on{background:var(--hi2);border-color:rgba(200,240,60,0.3);color:var(--hi);}

/* ── FEED ── */
.fi{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;border-bottom:1px solid var(--rule);animation:feedSlide 0.3s ease both;}
.fi:last-child{border-bottom:none;}
.fi-sev{width:3px;flex-shrink:0;align-self:stretch;border-radius:1px;min-height:36px;margin-top:2px;}
.fi-body{flex:1;min-width:0;}
.fi-type{font-family:var(--cond);font-size:13px;font-weight:600;letter-spacing:0.03em;color:var(--t1);margin-bottom:2px;}
.fi-detail{font-size:11px;font-weight:300;color:var(--t3);line-height:1.4;}
.fi-plate{font-family:var(--mono);font-size:10px;background:var(--bg3);border:1px solid var(--rule2);padding:1px 5px;border-radius:2px;color:var(--t2);margin-top:4px;display:inline-block;letter-spacing:0.06em;}
.fi-time{font-family:var(--mono);font-size:9px;color:var(--t3);white-space:nowrap;margin-top:2px;}
.fi-tag{font-family:var(--mono);font-size:8px;letter-spacing:0.12em;padding:2px 6px;text-transform:uppercase;margin-top:4px;display:inline-block;border-radius:1px;}

/* ── FR MODULE ── */
.fr-panel{animation:scaleIn 0.4s ease both;}
.fr-stage{background:#020806;position:relative;overflow:hidden;}
.fr-grid{position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 22px,rgba(200,240,60,0.04) 22px,rgba(200,240,60,0.04) 23px),repeating-linear-gradient(90deg,transparent,transparent 22px,rgba(200,240,60,0.04) 22px,rgba(200,240,60,0.04) 23px);}
.fr-face-wrap{position:relative;width:110px;height:130px;margin:0 auto;}
.fr-face{width:110px;height:130px;border-radius:4px;background:var(--bg3);border:1px solid var(--rule2);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:36px;color:var(--t3);position:relative;overflow:hidden;}
.fr-scanline{position:absolute;left:0;right:0;height:1.5px;background:rgba(200,240,60,0.55);animation:scanH 2s ease-in-out infinite;}
.fr-corner{position:absolute;width:14px;height:14px;}
.fr-corner.tl{top:-1px;left:-1px;border-top:2px solid var(--hi);border-left:2px solid var(--hi);}
.fr-corner.tr{top:-1px;right:-1px;border-top:2px solid var(--hi);border-right:2px solid var(--hi);}
.fr-corner.bl{bottom:-1px;left:-1px;border-bottom:2px solid var(--hi);border-left:2px solid var(--hi);}
.fr-corner.br{bottom:-1px;right:-1px;border-bottom:2px solid var(--hi);border-right:2px solid var(--hi);}
.fr-tracking-box{position:absolute;border:1.5px solid rgba(200,240,60,0.7);border-radius:2px;animation:pulse 1.5s ease-in-out infinite;}
.fr-result-match{border-color:rgba(200,240,60,0.8)!important;}
.fr-result-mismatch{border-color:rgba(240,60,60,0.8)!important;}
.fr-progress-bar{height:2px;background:var(--rule2);overflow:hidden;}
.fr-progress-fill{height:100%;background:var(--hi);transition:width 0.1s linear;}
.fr-status-text{font-family:var(--mono);font-size:9px;letter-spacing:0.12em;text-transform:uppercase;}
.fr-match-card{animation:scaleIn 0.35s ease both;}
.fr-owner-photo{width:56px;height:56px;border-radius:3px;background:var(--bg3);border:1px solid var(--rule2);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:20px;color:var(--t2);flex-shrink:0;position:relative;overflow:hidden;}

/* ── LOOKUP ── */
.lk-search{display:flex;border-bottom:1px solid var(--rule);}
.lk-in{flex:1;padding:12px 16px;background:var(--bg2);border:none;border-right:1px solid var(--rule);font-family:var(--mono);font-size:12px;letter-spacing:0.05em;color:var(--t1);outline:none;}
.lk-in::placeholder{color:var(--t3);}
.lk-in:focus{background:var(--bg3);}
.lk-btn{padding:12px 20px;background:var(--hi);color:#0d0f0e;border:none;cursor:pointer;font-family:var(--cond);font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;transition:opacity 0.1s;}
.lk-btn:hover{opacity:0.85;}
.profile-grid{display:grid;grid-template-columns:160px 1fr;}
.profile-photo{border-right:1px solid var(--rule);padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--bg2);}
.profile-av{width:72px;height:72px;border-radius:3px;background:var(--bg3);border:1px solid var(--rule2);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:24px;letter-spacing:0.04em;color:var(--t2);position:relative;overflow:hidden;}
.fr-scan{position:absolute;left:0;right:0;height:1px;background:rgba(200,240,60,0.5);animation:scanH 2s ease-in-out infinite;}
.fr-c::before,.fr-c::after{content:'';position:absolute;width:10px;height:10px;border-color:var(--hi);border-style:solid;}
.fr-c::before{top:-1px;left:-1px;border-width:2px 0 0 2px;}
.fr-c::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;}
.profile-match{font-family:var(--mono);font-size:9px;letter-spacing:0.12em;color:var(--hi);text-transform:uppercase;}
.profile-conf{font-family:var(--mono);font-size:9px;color:var(--t3);}
.profile-flag{font-family:var(--cond);font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:2px 8px;border:1px solid rgba(240,60,60,0.4);color:var(--red);background:var(--red2);border-radius:1px;margin-top:4px;}
.profile-data{padding:20px;}
.profile-name{font-family:var(--head);font-size:28px;letter-spacing:0.04em;color:var(--t1);line-height:0.9;margin-bottom:4px;}
.profile-id{font-family:var(--mono);font-size:10px;color:var(--t3);letter-spacing:0.08em;margin-bottom:16px;}
.pfields{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin-bottom:16px;}
.pf-l{font-family:var(--mono);font-size:9px;letter-spacing:0.1em;color:var(--t3);text-transform:uppercase;margin-bottom:2px;}
.pf-v{font-family:var(--cond);font-size:14px;font-weight:400;color:var(--t1);}
.pf-v.mono{font-family:var(--mono);font-size:12px;}
.pf-v.danger{color:var(--red);font-weight:600;}
.pf-v.ok{color:var(--hi);}

/* ── TABLES ── */
.log-table{width:100%;border-collapse:collapse;}
.log-table th{font-family:var(--mono);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--t3);padding:8px 14px;text-align:left;border-bottom:1px solid var(--rule);background:var(--bg2);}
.log-table td{padding:10px 14px;border-bottom:1px solid var(--rule);font-size:12px;font-weight:300;color:var(--t2);}
.log-table tr:last-child td{border-bottom:none;}
.log-table tr:hover td{background:var(--rule);}
.lt-mono{font-family:var(--mono);font-size:10px;}
.lt-pill{font-family:var(--mono);font-size:8px;letter-spacing:0.1em;padding:2px 7px;text-transform:uppercase;border:1px solid;border-radius:1px;}
.lp-arrest{color:var(--red);border-color:rgba(240,60,60,0.35);}
.lp-fine{color:var(--amber);border-color:rgba(240,162,60,0.35);}
.lp-warn{color:var(--blue);border-color:rgba(60,143,240,0.35);}
.lp-release{color:var(--hi);border-color:rgba(200,240,60,0.35);}
.lp-check{color:var(--t2);border-color:var(--rule2);}
.vh-table{width:100%;border-collapse:collapse;}
.vh-table th{font-family:var(--mono);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--t3);padding:7px 12px;text-align:left;border-bottom:1px solid var(--rule);}
.vh-table td{padding:8px 12px;border-bottom:1px solid var(--rule);font-size:12px;color:var(--t2);font-weight:300;}
.vh-table tr:last-child td{border-bottom:none;}
.vh-table tr:hover td{background:var(--rule);}
.vh-mono{font-family:var(--mono);font-size:10px;}
.vh-tag{font-family:var(--mono);font-size:8px;letter-spacing:0.1em;padding:2px 6px;text-transform:uppercase;border:1px solid;border-radius:1px;}
.vt-fine{color:var(--red);border-color:rgba(240,60,60,0.3);}
.vt-paid{color:var(--hi);border-color:rgba(200,240,60,0.3);}

/* ── ANALYTICS ── */
.an-row{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--rule);}
.an-cell{padding:20px 24px;border-right:1px solid var(--rule);animation:fadeUp 0.4s ease both;}
.an-cell:last-child{border-right:none;}
.an-h{font-family:var(--mono);font-size:9px;letter-spacing:0.14em;color:var(--t3);text-transform:uppercase;margin-bottom:14px;}
.chart-w{position:relative;width:100%;}
.map-body{background:#020a04;border-radius:3px;height:220px;position:relative;overflow:hidden;}
.map-grid-bg{position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 28px,rgba(200,240,60,0.04) 28px,rgba(200,240,60,0.04) 29px),repeating-linear-gradient(90deg,transparent,transparent 28px,rgba(200,240,60,0.04) 28px,rgba(200,240,60,0.04) 29px);}
.hz{position:absolute;border-radius:50%;}
.hz-ring{position:absolute;border-radius:50%;border:1px solid;animation:ringPulse 2.5s ease-in-out infinite;}
.map-lbl{position:absolute;transform:translateX(-50%);font-family:var(--mono);font-size:9px;letter-spacing:0.06em;background:rgba(240,60,60,0.82);color:#fff;padding:2px 6px;border-radius:1px;white-space:nowrap;pointer-events:none;}
.map-cam{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--hi);border:1px solid rgba(255,255,255,0.5);transform:translate(-50%,-50%);}
.map-cam::after{content:attr(data-l);position:absolute;bottom:calc(100% + 3px);left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:8px;color:rgba(200,240,60,0.5);white-space:nowrap;}

/* ── OFFICER ── */
.int-row{margin-bottom:12px;animation:fadeUp 0.4s ease both;}
.int-row:last-child{margin-bottom:0;}
.int-top{display:flex;justify-content:space-between;margin-bottom:5px;}
.int-name{font-family:var(--cond);font-size:13px;font-weight:500;color:var(--t1);}
.int-score{font-family:var(--mono);font-size:10px;color:var(--hi);}
.int-bar{height:2px;background:var(--rule2);border-radius:1px;overflow:hidden;}
.int-fill{height:100%;background:var(--hi);border-radius:1px;transition:width 1.2s ease;}
.int-stops{font-family:var(--mono);font-size:9px;color:var(--t3);margin-top:2px;}
.chain-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);align-items:flex-start;}
.chain-row:last-child{border-bottom:none;}
.chain-hash{font-family:var(--mono);font-size:9px;letter-spacing:0.05em;color:var(--blue);flex-shrink:0;}
.chain-desc{font-size:11px;font-weight:300;color:var(--t2);flex:1;}
.chain-time{font-family:var(--mono);font-size:9px;color:var(--t3);white-space:nowrap;}

/* ── SETTINGS ── */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--rule);}
.s-cell{border-right:1px solid var(--rule);}
.s-cell:last-child{border-right:none;}
.s-param{padding:16px 20px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;}
.s-param-name{font-family:var(--cond);font-size:13px;color:var(--t1);}
.s-toggle-on{font-family:var(--mono);font-size:9px;letter-spacing:0.1em;color:var(--hi);border:1px solid rgba(200,240,60,0.3);padding:2px 8px;border-radius:1px;}
.s-toggle-off{font-family:var(--mono);font-size:9px;letter-spacing:0.1em;color:var(--t3);border:1px solid var(--rule2);padding:2px 8px;border-radius:1px;}
.s-big-val{font-family:var(--head);font-size:32px;line-height:1;}

/* ── FULL SCROLL ── */
.full-scroll{height:calc(100vh - 50px - 82px);overflow-y:auto;}
.full-scroll::-webkit-scrollbar{width:3px;}
.full-scroll::-webkit-scrollbar-thumb{background:var(--rule2);}
</style>
</head>
<body>
<div id="root"></div>

<script>
const {useState,useEffect,useRef,useCallback} = React;
const h = React.createElement;

// ── DATA ──
const CAMS=[
  {id:'CAM-07',loc:'Anna Salai Junction'},
  {id:'CAM-03',loc:'Koyambedu Flyover'},
  {id:'CAM-12',loc:'ECR Zone 4'},
  {id:'CAM-15',loc:'T.Nagar Signal'},
  {id:'CAM-02',loc:'Guindy Underpass'},
  {id:'CAM-18',loc:'Vadapalani Jn'},
];
const PLATES=['TN09 AB 4471','TN22 GH 3340','TN01 EF 9920','TN05 CD 7812','MH12 XY 9988','KA03 ZZ 1234'];
const VTS=['Overspeeding','DUI suspected','Signal violation','Wrong lane'];
const FTYPES=[
  {sev:'#f03c3c',tag:'HIGH',label:'Overspeeding',detail:'94 km/h in 50 km/h zone'},
  {sev:'#f0a23c',tag:'HIGH',label:'DUI — Alcohol',detail:'BAC 0.12% · over legal limit'},
  {sev:'#3c8ff0',tag:'LOW',label:'Signal Violation',detail:'Red light · controlled junction'},
  {sev:'#c8f03c',tag:'ALERT',label:'Wanted Vehicle',detail:'Stolen vehicle match #0811'},
  {sev:'#f03c3c',tag:'MED',label:'Reckless Driving',detail:'Erratic lane changes · 500m'},
];

const FR_DRIVERS = [
  {initials:'RK',name:'Rajesh Kannan',id:'MH-DL-2019-884412',plate:'TN09 AB 4471',vehicle:'2018 Maruti Swift',match:true,confidence:98.4,flag:true},
  {initials:'PD',name:'Preethi Devi',id:'TN-DL-2021-221034',plate:'TN22 GH 3340',vehicle:'2020 Honda City',match:false,confidence:31.2,flag:false,owner:{initials:'SK',name:'Suresh Kumar',id:'TN-DL-2018-110920'}},
  {initials:'AM',name:'Arjun Mohan',id:'TN-DL-2020-554812',plate:'TN05 CD 7812',vehicle:'2019 Hyundai Creta',match:true,confidence:96.7,flag:false},
  {initials:'SN',name:'Sunita Nair',id:'TN-DL-2017-887632',plate:'TN01 EF 9920',vehicle:'2021 Toyota Innova',match:true,confidence:99.1,flag:false},
];

// ── CLOCK ──
function useClock(){
  const [t,setT]=useState('--:--:--');
  useEffect(()=>{
    const tick=()=>setT(new Date().toLocaleTimeString('en-IN',{hour12:false}));
    tick(); const id=setInterval(tick,1000); return ()=>clearInterval(id);
  },[]);
  return t;
}

// ── ANIMATED COUNT ──
function AnimVal({val,delay=0}){
  const [disp,setDisp]=useState('0');
  useEffect(()=>{
    const timer=setTimeout(()=>setDisp(val),delay*1000+100);
    return ()=>clearTimeout(timer);
  },[val,delay]);
  return h('span',null,disp);
}

// ── METRICS STRIP ──
function Metrics({rows}){
  return h('div',{className:'metrics'},
    rows.map((r,i)=>h('div',{className:'met',key:i,style:{'--delay':`${i*0.08}s`}},
      h('div',{className:'met-shine',style:{'--delay':`${i*0.15}s`}}),
      h('div',{className:'met-key'},r.key),
      h('div',{className:`met-val ${r.cls||''}`},r.val),
      h('div',{className:`met-delta ${r.dcls||'neu'}`},r.delta),
      h('div',{className:`met-bar ${r.bar||'bl'}`,style:{width:'100%','--w':'100%','--delay':`${i*0.1}s`}})
    ))
  );
}

// ── FEED ITEM ──
function FeedItem({item}){
  return h('div',{className:'fi',key:item.id},
    h('div',{className:'fi-sev',style:{background:item.sev}}),
    h('div',{className:'fi-body'},
      h('div',{className:'fi-type'},item.label),
      h('div',{className:'fi-detail'},item.detail+' · '+item.cam),
      h('div',{className:'fi-plate'},item.plate),
      h('span',{className:'fi-tag',style:{color:item.sev,border:`1px solid ${item.sev}`,opacity:0.85}},item.tag)
    ),
    h('div',{className:'fi-time'},item.time)
  );
}

// ── CAMERA CANVAS ──
function CameraCanvas({activeCam,onDetect}){
  const canvasRef=useRef(null);
  const svgRef=useRef(null);
  const vehsRef=useRef([]);
  const tsRef=useRef({lastSpawn:0,lastStat:0});
  const detCountRef=useRef(0);
  const [stats,setStats]=useState({vpm:14,spd:61,det:0});

  const CCAR=['#1b3a5a','#2b1a4a','#1a4a2c','#3e1a1a','#1b2b3a','#3b2b1a','#252e3e'];
  const PPLTS=['TN09AB4471','TN22GH3340','TN05CD7812','TN01EF9920','MH12XY9988','KA03ZZ1234','TN44PQ5571'];
  const CW=900,CH=400,HZ=138;
  const LX=[-165,-55,55,165];

  function spawnV(){
    vehsRef.current.push({lane:LX[Math.floor(Math.random()*LX.length)],z:0.04,sp:0.0014+Math.random()*0.0022,clr:CCAR[Math.floor(Math.random()*CCAR.length)],plate:PPLTS[Math.floor(Math.random()*PPLTS.length)],isV:Math.random()<0.23,vt:VTS[Math.floor(Math.random()*VTS.length)],vid:Math.random().toString(36).slice(2,7).toUpperCase(),det:false});
  }
  for(let i=0;i<4;i++){spawnV();vehsRef.current[i].z=0.1+i*0.21;}

  useEffect(()=>{
    let raf;
    function loop(ts){
      const c=canvasRef.current; const so=svgRef.current;
      if(!c){raf=requestAnimationFrame(loop);return;}
      const ctx=c.getContext('2d');
      if(ts-tsRef.current.lastSpawn>1800){spawnV();tsRef.current.lastSpawn=ts;}
      vehsRef.current.forEach(v=>{v.z+=v.sp;});
      vehsRef.current=vehsRef.current.filter(v=>v.z<=1.1);

      // draw
      ctx.clearRect(0,0,CW,CH);
      ctx.fillStyle='#020403';ctx.fillRect(0,0,CW,CH);
      ctx.fillStyle='#0b1610';ctx.fillRect(0,HZ,CW,CH-HZ);
      const vpx=CW/2;
      ctx.beginPath();ctx.moveTo(vpx-65,HZ);ctx.lineTo(vpx+65,HZ);ctx.lineTo(CW/2+280,CH);ctx.lineTo(CW/2-280,CH);ctx.closePath();
      ctx.fillStyle='#101e16';ctx.fill();
      [-215,-90,90,215].forEach(ox=>{ctx.beginPath();ctx.moveTo(vpx,HZ);ctx.lineTo(CW/2+ox,CH);ctx.strokeStyle='rgba(200,240,60,0.05)';ctx.lineWidth=1;ctx.stroke();});
      ctx.beginPath();ctx.moveTo(vpx,HZ);ctx.lineTo(CW/2-280,CH);ctx.moveTo(vpx,HZ);ctx.lineTo(CW/2+280,CH);
      ctx.strokeStyle='rgba(200,240,60,0.15)';ctx.lineWidth=2;ctx.stroke();
      for(let d=0;d<1;d+=0.14){const t=(d+ts*0.00013)%1;const y=HZ+t*(CH-HZ);const lw=2+t*24;ctx.beginPath();ctx.moveTo(CW/2-lw/2,y);ctx.lineTo(CW/2+lw/2,y);ctx.strokeStyle=`rgba(255,255,110,${0.38*t})`;ctx.lineWidth=1.5;ctx.stroke();}
      ctx.fillStyle='#040804';ctx.fillRect(0,0,CW,HZ);
      [[42,52,36,76],[138,40,30,86],[598,46,44,80],[666,36,27,70],[56,30,20,66],[718,50,36,84]].forEach(([x,y,w,hh])=>{ctx.fillStyle='#0a1610';ctx.fillRect(x,HZ-hh,w,hh);for(let wy=HZ-hh+8;wy<HZ-8;wy+=12)for(let wx=x+5;wx<x+w-5;wx+=10)if((wx*wy)%3!==0){ctx.fillStyle=`rgba(255,195,70,${0.1+((wx+wy)%5)*0.05})`;ctx.fillRect(wx,wy,5,7);}});
      for(let i=0;i<60;i++){const sx=(i*119+11)%CW,sy=(i*63+17)%(HZ-14);ctx.fillStyle=`rgba(255,255,255,${(i%7===0?0.8:0.25)*(0.5+0.5*Math.sin(ts*0.001+i))})`;ctx.fillRect(sx,sy,1,1);}
      vehsRef.current.forEach(v=>{const sc=0.28+v.z*0.72;const bx=CW/2+v.lane*(0.3+v.z*0.7);const by=HZ+v.z*(CH-HZ);const bw=46*sc,bh=19*sc;ctx.fillStyle=v.clr;ctx.fillRect(bx-bw/2,by-bh,bw,bh);ctx.fillStyle='rgba(100,170,255,0.22)';ctx.fillRect(bx-bw/2+4*sc,by-bh+3*sc,bw-8*sc,6*sc);if(v.z>0.5){ctx.fillStyle='rgba(255,255,130,0.65)';ctx.fillRect(bx-bw/2-4*sc,by-bh/2,4*sc,4*sc);ctx.fillRect(bx+bw/2,by-bh/2,4*sc,4*sc);}});

      // SVG overlay
      if(so){
        so.innerHTML='';
        vehsRef.current.forEach(v=>{
          if(v.z<0.1||v.z>1.02)return;
          const sc=0.28+v.z*0.72;const bx=CW/2+v.lane*(0.3+v.z*0.7);const by=HZ+v.z*(CH-HZ);const bw=46*sc,bh=19*sc;
          const x1=bx-bw/2-4,y1=by-bh-4,x2=bx+bw/2+4,y2=by+4;
          const col=v.isV?'#f03c3c':'#c8f03c';const op=Math.min(1,0.38+v.z*0.65);
          const g=document.createElementNS('http://www.w3.org/2000/svg','g');
          const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
          r.setAttribute('x',x1);r.setAttribute('y',y1);r.setAttribute('width',x2-x1);r.setAttribute('height',y2-y1);r.setAttribute('fill','none');r.setAttribute('stroke',col);r.setAttribute('stroke-width','1.2');r.setAttribute('rx','1');r.setAttribute('opacity',op);g.appendChild(r);
          [[x1,y1,1,1],[x2,y1,-1,1],[x1,y2,1,-1],[x2,y2,-1,-1]].forEach(([cx3,cy,dx,dy])=>{['h','v'].forEach(axis=>{const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',cx3);l.setAttribute('y1',cy);l.setAttribute('x2',axis==='h'?cx3+dx*8:cx3);l.setAttribute('y2',axis==='v'?cy+dy*8:cy);l.setAttribute('stroke',col);l.setAttribute('stroke-width','1.8');l.setAttribute('opacity',0.5+v.z*0.5);g.appendChild(l);});});
          if(v.z>0.24){const spd=Math.round(44+v.sp*13000);const lbl=document.createElementNS('http://www.w3.org/2000/svg','text');lbl.setAttribute('x',x1);lbl.setAttribute('y',y1-3);lbl.setAttribute('fill',col);lbl.setAttribute('font-size',Math.max(7.5,9.5*v.z));lbl.setAttribute('font-family','IBM Plex Mono,monospace');lbl.setAttribute('letter-spacing','0.05em');lbl.textContent=`${v.vid} · ${spd}km/h`;g.appendChild(lbl);}
          if(v.z>0.46&&v.isV){const bg=document.createElementNS('http://www.w3.org/2000/svg','rect');bg.setAttribute('x',x1);bg.setAttribute('y',y2+2);bg.setAttribute('width',Math.min(108,x2-x1));bg.setAttribute('height','13');bg.setAttribute('fill','rgba(240,60,60,0.9)');bg.setAttribute('rx','1');g.appendChild(bg);const bt=document.createElementNS('http://www.w3.org/2000/svg','text');bt.setAttribute('x',x1+3);bt.setAttribute('y',y2+11);bt.setAttribute('fill','#fff');bt.setAttribute('font-size','7.5');bt.setAttribute('font-family','IBM Plex Mono,monospace');bt.textContent=v.vt.toUpperCase();g.appendChild(bt);}
          if(v.z>0.38){const pl=document.createElementNS('http://www.w3.org/2000/svg','text');pl.setAttribute('x',bx-bw/2+2*sc);pl.setAttribute('y',by-3);pl.setAttribute('fill','rgba(255,255,255,0.45)');pl.setAttribute('font-size',Math.max(6.5,8*v.z));pl.setAttribute('font-family','IBM Plex Mono,monospace');pl.textContent=v.plate;g.appendChild(pl);}
          so.appendChild(g);
          if(v.z>0.42&&v.isV&&!v.det){v.det=true;detCountRef.current++;const ft=FTYPES.find(f=>f.label.toLowerCase().includes(v.vt.split(' ')[0].toLowerCase()))||FTYPES[0];onDetect({...ft,plate:v.plate.replace(/(.{2})(.{2})(.+)/,'$1$2 $3'),cam:CAMS[activeCam].id,id:Date.now()});}
        });
      }
      if(ts-tsRef.current.lastStat>2200){const vpm=9+Math.round(Math.random()*9);const spd=52+Math.round(Math.random()*18);setStats({vpm,spd,det:detCountRef.current});tsRef.current.lastStat=ts;}
      raf=requestAnimationFrame(loop);
    }
    raf=requestAnimationFrame(loop);
    return ()=>cancelAnimationFrame(raf);
  },[activeCam]);

  return h(React.Fragment,null,
    h('canvas',{ref:canvasRef,id:'camC',width:CW,height:CH,style:{display:'block',width:'100%',height:'100%'}}),
    h('svg',{ref:svgRef,id:'camSVG',viewBox:`0 0 ${CW} ${CH}`,preserveAspectRatio:'none',style:{position:'absolute',top:0,left:0,width:'100%',height:'100%',pointerEvents:'none'}}),
    h('div',{className:'scanlines'}),
    h('div',{className:'cam-sweep'}),
    h('div',{className:'cam-hud-bot'},
      h('div',{className:'cstat'},h('span',{className:'cstat-v'},stats.vpm),h('span',{className:'cstat-l'},'Veh / min')),
      h('div',{className:'cdiv'}),
      h('div',{className:'cstat'},h('span',{className:'cstat-v'},stats.spd+' km/h'),h('span',{className:'cstat-l'},'Avg Speed')),
      h('div',{className:'cdiv'}),
      h('div',{className:'cstat'},h('span',{className:'cstat-v'},stats.det),h('span',{className:'cstat-l'},'Detected')),
      h('div',{className:'cdiv'}),
      h('div',{className:'cstat'},h('span',{className:'cstat-v',style:{color:'var(--hi)'}},'98.4%'),h('span',{className:'cstat-l'},'AI Accuracy'))
    )
  );
}

// ── FACIAL RECOGNITION PANEL ──
function FRPanel(){
  const [phase,setPhase]=useState('idle'); // idle | scanning | result
  const [progress,setProgress]=useState(0);
  const [selected,setSelected]=useState(null);
  const [result,setResult]=useState(null);
  const [capturedPlate,setCapturedPlate]=useState('');
  const timerRef=useRef(null);

  function startScan(driver){
    setSelected(driver);
    setPhase('scanning');
    setProgress(0);
    setResult(null);
    let p=0;
    timerRef.current=setInterval(()=>{
      p+=Math.random()*4+2;
      if(p>=100){
        p=100;clearInterval(timerRef.current);
        setTimeout(()=>{setPhase('result');setResult(driver);},300);
      }
      setProgress(Math.min(100,p));
    },60);
  }

  function reset(){setPhase('idle');setSelected(null);setResult(null);setProgress(0);setCapturedPlate('');}

  const plateOptions=['TN09 AB 4471','TN22 GH 3340','TN05 CD 7812','TN01 EF 9920'];

  return h('div',{className:'fr-panel',style:{animation:'scaleIn 0.3s ease both'}},
    // Header
    h('div',{className:'ph'},
      h('span',{className:'ph-title'},'Facial Recognition — Owner Verification'),
      phase!=='idle'&&h('button',{className:'ph-btn',onClick:reset},'Reset')
    ),

    // Step 1: Select plate
    phase==='idle'&&h('div',{style:{padding:'20px 18px',borderBottom:'1px solid var(--rule)'}},
      h('div',{style:{fontFamily:'var(--mono)',fontSize:'9px',letterSpacing:'0.12em',color:'var(--t3)',textTransform:'uppercase',marginBottom:'10px'}},'Select stopped vehicle plate'),
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}},
        plateOptions.map(p=>h('button',{key:p,onClick:()=>{setCapturedPlate(p);const d=FR_DRIVERS.find(d=>d.plate===p)||FR_DRIVERS[0];startScan(d);},
          style:{padding:'10px 12px',background:'var(--bg2)',border:'1px solid var(--rule2)',borderRadius:'3px',cursor:'pointer',fontFamily:'var(--mono)',fontSize:'11px',letterSpacing:'0.08em',color:'var(--t2)',textAlign:'left',transition:'all 0.15s'}},p))
      ),
      h('div',{style:{marginTop:'16px',padding:'12px 14px',background:'var(--bg2)',border:'1px solid var(--rule)',borderRadius:'3px'}},
        h('div',{style:{fontFamily:'var(--mono)',fontSize:'9px',color:'var(--t3)',letterSpacing:'0.1em',marginBottom:'6px'}},'HOW IT WORKS'),
        h('div',{style:{fontSize:'11px',fontWeight:300,color:'var(--t2)',lineHeight:1.6}},'The AI captures the driver\'s face via the roadside camera and cross-references it against the registered vehicle owner\'s photo in the database. A mismatch flags the vehicle for further inspection.')
      )
    ),

    // Step 2: Scanning animation
    phase==='scanning'&&selected&&h('div',{style:{animation:'fadeIn 0.3s ease both'}},
      h('div',{className:'fr-stage',style:{padding:'24px 18px',borderBottom:'1px solid var(--rule)'}},
        h('div',{className:'fr-grid'}),
        h('div',{style:{position:'relative',zIndex:1}},
          h('div',{style:{display:'flex',gap:'24px',alignItems:'center',marginBottom:'16px'}},
            // Captured face (driver)
            h('div',{style:{flex:1,textAlign:'center'}},
              h('div',{style:{fontFamily:'var(--mono)',fontSize:'8px',letterSpacing:'0.12em',color:'var(--t3)',textTransform:'uppercase',marginBottom:'8px'}},'Captured — roadside cam'),
              h('div',{className:'fr-face-wrap'},
                h('div',{className:'fr-face'},
                  selected.initials,
                  h('div',{className:'fr-scanline'}),
                  h('div',{className:'fr-corner tl'}),h('div',{className:'fr-corner tr'}),h('div',{className:'fr-corner bl'}),h('div',{className:'fr-corner br'}),
                  h('div',{className:'fr-tracking-box',style:{width:'60%',height:'55%',top:'22%',left:'20%'}})
                )
              )
            ),
            // VS
            h('div',{style:{fontFamily:'var(--head)',fontSize:'22px',color:'var(--t3)',flexShrink:0}},'VS'),
            // Owner photo
            h('div',{style:{flex:1,textAlign:'center'}},
              h('div',{style:{fontFamily:'var(--mono)',fontSize:'8px',letterSpacing:'0.12em',color:'var(--t3)',textTransform:'uppercase',marginBottom:'8px'}},'Registered owner — database'),
              h('div',{className:'fr-face-wrap'},
                h('div',{className:'fr-face',style:{background:'rgba(60,143,240,0.08)',border:'1px solid rgba(60,143,240,0.2)'}},
                  selected.match ? selected.initials : (selected.owner?.initials||'?'),
                  h('div',{className:'fr-corner tl',style:{borderColor:'var(--blue)'}}),h('div',{className:'fr-corner tr',style:{borderColor:'var(--blue)'}}),h('div',{className:'fr-corner bl',style:{borderColor:'var(--blue)'}}),h('div',{className:'fr-corner br',style:{borderColor:'var(--blue)'}})
                )
              )
            )
          ),
          h('div',{style:{fontFamily:'var(--mono)',fontSize:'9px',letterSpacing:'0.1em',color:'var(--t3)',marginBottom:'6px',textTransform:'uppercase'}},`Analysing biometrics… ${Math.round(progress)}%`),
          h('div',{className:'fr-progress-bar'},
            h('div',{className:'fr-progress-fill',style:{width:`${progress}%`}})
          ),
          h('div',{style:{marginTop:'8px',display:'flex',justifyContent:'space-between',fontFamily:'var(--mono)',fontSize:'8px',color:'var(--t3)'}},
            h('span',null,'Plate: '+selected.plate),
            h('span',null,'Vehicle: '+selected.vehicle)
          )
        )
      )
    ),

    // Step 3: Result
    phase==='result'&&result&&h('div',{style:{animation:'scaleIn 0.35s ease both'}},
      // Result banner
      h('div',{style:{padding:'14px 18px',background:result.match?'rgba(200,240,60,0.06)':'rgba(240,60,60,0.08)',borderBottom:'1px solid '+(result.match?'rgba(200,240,60,0.2)':'rgba(240,60,60,0.2)')}},
        h('div',{style:{display:'flex',alignItems:'center',gap:'10px'}},
          h('div',{style:{width:'8px',height:'8px',borderRadius:'50%',background:result.match?'var(--hi)':'var(--red)',flexShrink:0}}),
          h('div',{style:{flex:1}},
            h('div',{style:{fontFamily:'var(--cond)',fontSize:'15px',fontWeight:700,color:result.match?'var(--hi)':'var(--red)',letterSpacing:'0.04em'}},
              result.match?'IDENTITY CONFIRMED — Owner Match':'IDENTITY MISMATCH — Owner Differs'
            ),
            h('div',{style:{fontFamily:'var(--mono)',fontSize:'9px',color:'var(--t3)',marginTop:'3px',letterSpacing:'0.08em'}},
              `Confidence: ${result.confidence}% · ${result.match?'No further action required':'Vehicle flagged for inspection'}`
            )
          ),
          h('span',{style:{fontFamily:'var(--mono)',fontSize:'9px',letterSpacing:'0.1em',padding:'2px 8px',borderRadius:'1px',border:`1px solid ${result.match?'rgba(200,240,60,0.4)':'rgba(240,60,60,0.4)'}`,color:result.match?'var(--hi)':'var(--red)'}},
            result.match?'VERIFIED':'FLAGGED'
          )
        )
      ),
      // Face comparison side by side
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',borderBottom:'1px solid var(--rule)'}},

function useChart(id,config,deps){
  const ref=useRef(null);
  useEffect(()=>{
    const el=document.getElementById(id);if(!el)return;
    const existing=Chart.getChart(el);if(existing)existing.destroy();
    ref.current=new Chart(el,config);
    return()=>{if(ref.current)ref.current.destroy();};
  },deps||[]);
}

              h('div',null,h('div',{className:'pf-l'},'Insurance'),h('div',{className:'pf-v ok'},'Valid · Sep 2025')),
              h('div',null,h('div',{className:'pf-l'},'BAC Last Test'),h('div',{className:'pf-v danger'},'0.09% — Over Limit'))
            ),
            h('div',{style:{borderTop:'1px solid var(--rule)',paddingTop:'14px'}},
              h('div',{style:{fontFamily:'var(--mono)',fontSize:'9px',letterSpacing:'0.12em',color:'var(--t3)',textTransform:'uppercase',marginBottom:'10px'}},'Violation History — 12 months'),
              h('table',{className:'vh-table'},
                h('thead',null,h('tr',null,['Date','Type','Location','Fine','Status'].map(c=>h('th',{key:c},c)))),
                h('tbody',null,
                  [{d:'12 Mar 2025',t:'DUI — 0.09% BAC',l:'Anna Salai Jn.',f:'₹10,000',s:'vt-fine',sl:'Fined'},{d:'07 Jan 2025',t:'Overspeeding 78/50',l:'ECR Zone 4',f:'₹2,000',s:'vt-paid',sl:'Paid'},{d:'22 Oct 2024',t:'Signal Violation',l:'Koyambedu Flyover',f:'₹500',s:'vt-paid',sl:'Paid'}]
                  .map(r=>h('tr',{key:r.d},h('td',{className:'vh-mono'},r.d),h('td',null,r.t),h('td',null,r.l),h('td',{className:'vh-mono'},r.f),h('td',null,h('span',{className:`vh-tag ${r.s}`},r.sl))))
                )

// ── MAIN APP ──
function App(){
  const [tab,setTab]=useState('feed');
  const [activeCam,setActiveCam]=useState(0);
  const [feedItems,setFeedItems]=useState(()=>Array.from({length:9},(_,i)=>{const ft=FTYPES[i%FTYPES.length];return{...ft,plate:PLATES[i%PLATES.length],cam:CAMS[i%CAMS.length].id,id:Date.now()-i*4000,time:new Date(Date.now()-i*4000).toLocaleTimeString('en-IN',{hour12:false})};}).reverse());
  const [vcnt,setVcnt]=useState(247);
  const clock=useClock();

  function handleDetect(item){
    const now=new Date().toLocaleTimeString('en-IN',{hour12:false});
    setFeedItems(prev=>[{...item,time:now},...prev].slice(0,16));
    setVcnt(v=>v+1);
  }
  function simEvent(){
    const ft=FTYPES[Math.floor(Math.random()*FTYPES.length)];
    const plate=PLATES[Math.floor(Math.random()*PLATES.length)];
    const now=new Date().toLocaleTimeString('en-IN',{hour12:false});
    setFeedItems(prev=>[{...ft,plate,cam:CAMS[activeCam].id,id:Date.now(),time:now},...prev].slice(0,16));
    setVcnt(v=>v+1);
  }

  const TABS=[{id:'feed',label:'Live Detection',badge:vcnt},{id:'fr',label:'Face Recognition'},{id:'lookup',label:'Driver Lookup'},{id:'analytics',label:'Traffic Analytics'},{id:'officer',label:'Officer Activity'},{id:'settings',label:'Settings'},{id:'auditlog',label:'Audit Log'}];
  const TITLES={feed:'Live Detection — Zone 4',fr:'Facial Recognition — Owner Verification',lookup:'Driver / Vehicle Lookup',analytics:'Traffic Analytics & Heatmaps',officer:'Officer Activity & Transparency',settings:'System Settings',auditlog:'Full Audit Log — Blockchain Verified'};

  return h('div',{style:{display:'flex',width:'100%',height:'100vh',overflow:'hidden'}},
    // Sidebar
    h('nav',{className:'sb'},
      h('div',{className:'sb-brand'},
        h('div',{className:'sb-sys'},'System / v2.5.1'),
        h('div',{className:'sb-name'},'STES'),
        h('div',{className:'sb-sub'},'Smart Traffic Enforcement')
      ),
      h('div',{className:'sb-sec'},'Monitor'),
      ...[{id:'feed',label:'Live Detection',badge:vcnt},{id:'fr',label:'Face Recognition'},{id:'lookup',label:'Driver Lookup'}].map(t=>
        h('a',{key:t.id,className:`sb-item${tab===t.id?' on':''}`,href:'#',onClick:(e)=>{e.preventDefault();setTab(t.id);}},
          t.label, t.badge&&h('span',{className:'sb-badge'},t.badge)
        )
      ),
      h('div',{className:'sb-sec'},'Reports'),
      ...[{id:'analytics',label:'Traffic Analytics'},{id:'officer',label:'Officer Activity'}].map(t=>
        h('a',{key:t.id,className:`sb-item${tab===t.id?' on':''}`,href:'#',onClick:(e)=>{e.preventDefault();setTab(t.id);}},t.label)
      ),
      h('div',{className:'sb-sec'},'System'),
      ...[{id:'settings',label:'Settings'},{id:'auditlog',label:'Audit Log'}].map(t=>
        h('a',{key:t.id,className:`sb-item${tab===t.id?' on':''}`,href:'#',onClick:(e)=>{e.preventDefault();setTab(t.id);}},t.label)
      ),
      h('div',{className:'sb-foot'},
        h('div',{className:'sb-foot-lbl'},'Operator on duty'),
        h('div',{className:'sb-foot-name'},'Insp. R. Kumar'),
        h('div',{className:'sb-foot-role'},'Zone 4 Commander'),
        h('div',{className:'sb-foot-status'},h('div',{className:'sb-dot'}),'Active — Shift 2')
      )
    ),
    // Main
    h('div',{className:'main'},
      h('div',{className:'topbar'},
        h('div',{className:'tb-title'},TITLES[tab]),
        h('div',{className:'tb-live'},h('span',{className:'tb-dot'}),h('span',null,'Recording')),
        h('div',{className:'tb-zone'},'Chennai North · Zone 4'),
        h('div',{className:'tb-clock'},clock)
      ),
      h('div',{className:'scroll',key:tab},
        // Feed tab
        tab==='feed'&&h('div',null,
          h(Metrics,{rows:[{key:'Active Cameras',val:'18',cls:'hi',delta:'+3 online today',dcls:'dn',bar:'hi'},{key:'Violations Today',val:String(vcnt),cls:'rd',delta:'+12% vs yesterday',dcls:'up',bar:'rd'},{key:'DUI Detections',val:'14',cls:'am',delta:'+3 this shift',dcls:'up',bar:'am'},{key:'Cases Resolved',val:'189',cls:'hi',delta:'76% closure rate',dcls:'dn',bar:'bl'}]}),
          h('div',{className:'panes'},
            h('div',{className:'pane-l'},
              h('div',{className:'ph'},h('span',{className:'ph-title',id:'cam-ph-title'},CAMS[activeCam].id+' — '+CAMS[activeCam].loc),h('span',{style:{fontFamily:'var(--mono)',fontSize:'9px',color:'var(--t3)'}},'Live feed')),
              h('div',{className:'cam-wrap'},
                h(CameraCanvas,{activeCam,onDetect:handleDetect}),
                h('div',{className:'cam-hud-top'},
                  h('span',{className:'cam-rec-dot'}),h('span',{className:'cam-rec'},'REC'),
                  h('span',{className:'cam-hud-id'},CAMS[activeCam].id),
                  h('span',{className:'cam-hud-loc'},CAMS[activeCam].loc),
                  h('span',{className:'cam-hud-time'},clock)
                )
              ),
              h('div',{className:'cam-sel'},CAMS.map((c,i)=>h('button',{key:c.id,className:`csb${activeCam===i?' on':''}`,onClick:()=>setActiveCam(i)},c.id)))
            ),
            h('div',{className:'pane-r'},
              h('div',{className:'ph'},h('span',{className:'ph-title'},'Violation Feed'),h('button',{className:'ph-btn',onClick:simEvent},'+ Simulate')),
              h('div',{style:{overflowY:'auto',flex:1}},feedItems.map(item=>h(FeedItem,{key:item.id,item})))
            )
          )
        ),
        tab==='fr'&&h(FRPanel,{key:'fr'}),
        tab==='lookup'&&h(LookupSection,{key:'lookup'}),
        tab==='analytics'&&h(AnalyticsSection,{key:'analytics'}),
        tab==='officer'&&h(OfficerSection,{key:'officer'}),
        tab==='settings'&&h(SettingsSection,{key:'settings'}),
        tab==='auditlog'&&h(AuditSection,{key:'auditlog'})
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
